<style>
/* Indeling: app-gevoel. Kop met de week, één kaart per avond, tabbalk onderin (Week · Boodschappen · Bonus). */
:root {
  --bg: #eef2f7;
  --kaart: #ffffff;
  --tekst: #17233a;
  --zacht: #5d6a80;
  --lijn: #dde3ec;
  --blauw: #1f6fe0;
  --kop: #1f6fe0;
  --blauw-zacht: #e3edfd;
  --bonus: #ff7a00;
  --bonus-tekst: #ffffff;
  --bonus-zacht: #fff1e3;
  --groen: #1f9d55;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1522; --kaart: #192235; --tekst: #eef2f8; --zacht: #9aa7bd; --lijn: #28324a;
  --blauw: #5c9bff; --kop: #1b4d9e; --blauw-zacht: #1c2c4a; --bonus: #ff8a1f; --bonus-tekst: #1a0f00; --bonus-zacht: #3a2510;
  --groen: #3fcf7c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1522; --kaart: #192235; --tekst: #eef2f8; --zacht: #9aa7bd; --lijn: #28324a;
  --blauw: #5c9bff; --kop: #1b4d9e; --blauw-zacht: #1c2c4a; --bonus: #ff8a1f; --bonus-tekst: #1a0f00; --bonus-zacht: #3a2510;
  --groen: #3fcf7c; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--tekst); font-family: var(--font); font-size: 16px; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }

header.kop { background: var(--kop); color: #fff; padding-block: calc(22px + env(safe-area-inset-top, 0px)) 26px; border-radius: 0 0 26px 26px; }
header.kop .wrap { padding-block: 0; }
.kop small { display: block; font-weight: 700; opacity: .85; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
.kop h1 { margin: 4px 0 0; font-size: 28px; font-weight: 900; text-wrap: balance; }
.kop p { margin: 6px 0 0; font-weight: 600; opacity: .92; font-size: 15px; }
.besparing { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; background: rgba(255,255,255,.18); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; }

h2 { font-size: 20px; font-weight: 900; margin: 22px 0 10px; }
.lijst { display: grid; gap: 12px; }

.dag { background: var(--kaart); border-radius: 18px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(15,25,45,.06); }
.dag.vandaag { outline: 2.5px solid var(--blauw); }
.dag-kop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.dagnaam { font-size: 13px; font-weight: 800; color: var(--blauw); text-transform: uppercase; letter-spacing: .05em; }
.tijd { font-size: 13px; font-weight: 700; color: var(--zacht); white-space: nowrap; }
.gerecht { font-size: 19px; font-weight: 900; margin: 2px 0 6px; line-height: 1.25; }
.keuken { font-size: 13px; color: var(--zacht); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bonus-zacht); border-radius: 10px; padding: 4px 8px 4px 4px; font-size: 13px; font-weight: 700; min-width: 0; }
.sticker { background: var(--bonus); color: var(--bonus-tekst); font-weight: 900; font-size: 11px; padding: 3px 6px; border-radius: 6px; text-transform: uppercase; white-space: nowrap; }
details { margin-top: 10px; border-top: 1px solid var(--lijn); padding-top: 8px; }
summary { cursor: pointer; font-weight: 800; color: var(--blauw); font-size: 14px; list-style: none; padding: 4px 0; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " ›"; }
details[open] summary::after { content: " ⌄"; }
details ul, details ol { margin: 6px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.5; }
details h4 { margin: 10px 0 0; font-size: 13px; color: var(--zacht); text-transform: uppercase; letter-spacing: .05em; }

.afdeling { background: var(--kaart); border-radius: 18px; padding: 6px 16px; }
.afdeling h3 { margin: 10px 0 2px; font-size: 13px; color: var(--zacht); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--lijn); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--lijn); flex: none; margin: 0; display: grid; place-content: center; cursor: pointer; }
.item input:checked { background: var(--groen); border-color: var(--groen); }
.item input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px,-1px); }
.item input:focus-visible { outline: 2px solid var(--blauw); outline-offset: 2px; }
.item .naam { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; }
.item .voor { display: block; font-size: 12px; color: var(--zacht); font-weight: 600; }
.item.af .naam { text-decoration: line-through; color: var(--zacht); }
.voortgang { font-weight: 800; color: var(--zacht); font-size: 14px; margin: -4px 0 10px; }
.knop { appearance: none; border: 0; background: var(--blauw-zacht); color: var(--blauw); font: inherit; font-weight: 800; padding: 10px 14px; border-radius: 12px; cursor: pointer; }

.bonus-item { background: var(--kaart); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.bonus-item .naam { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
.bonus-item .waar { display: block; font-size: 12px; color: var(--zacht); font-weight: 600; }
.uitleg { color: var(--zacht); font-size: 14px; font-weight: 600; line-height: 1.45; margin: 0 0 12px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--kaart); border-top: 1px solid var(--lijn); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
nav.tabs button { appearance: none; border: 0; background: none; font: inherit; color: var(--zacht); font-weight: 800; font-size: 12px; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 4px; cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-selected="true"] { color: var(--blauw); }
nav.tabs .teller { background: var(--bonus); color: var(--bonus-tekst); border-radius: 999px; font-size: 10px; padding: 0 6px; margin-left: 2px; }
@media (prefers-reduced-motion: no-preference) { .dag, .item { transition: opacity .15s; } }

<script>

    <details><summary>Ingrediënten en bereiding</summary>
      <h4>Ingrediënten (${esc(M.personen)} pers.)</h4><ul>${d.ingredienten.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <h4>Zo maak je het</h4><ol>${d.stappen.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    </details>
  </article>`).join('') + '</div>';

function tekenLijst() {
  const alle = M.boodschappen.flatMap(a => a.items.map(i => i.naam));
  const klaar = alle.filter(n => af[n]).length;
  document.getElementById('lijstteller').textContent = alle.length - klaar || '';
  document.getElementById('tab-lijst').innerHTML = `<h2>Boodschappen</h2>
    <p class="voortgang">${klaar} van ${alle.length} in je mandje</p>
    <div class="lijst">` + M.boodschappen.map((a, ai) => `
      <div class="afdeling"><h3>${esc(a.afdeling)}</h3>` + a.items.map((i, ii) => `
        <label class="item${af[i.naam] ? ' af' : ''}" for="b-${ai}-${ii}">
          <input type="checkbox" id="b-${ai}-${ii}" data-naam="${esc(i.naam)}" ${af[i.naam] ? 'checked' : ''}>
          <span class="naam">${esc(i.naam)}${i.voor ? `<span class="voor">${esc(i.voor)}</span>` : ''}</span>
          ${i.korting ? `<span class="sticker">${esc(i.korting)}</span>` : ''}
        </label>`).join('') + '</div>').join('') +
    `</div><p style="margin-top:16px"><button class="knop" id="leeg" type="button">Alles weer leegmaken</button></p>`;
}
document.getElementById('tab-lijst').addEventListener('change', e => {
  if (e.target.matches('input[data-naam]')) { af[e.target.dataset.naam] = e.target.checked; if (!e.target.checked) delete af[e.target.dataset.naam]; bewaar(); tekenLijst(); }
});
document.getElementById('tab-lijst').addEventListener('click', e => { if (e.target.id === 'leeg') { af = {}; bewaar(); tekenLijst(); } });
tekenLijst();

document.getElementById('tab-bonus').innerHTML = `<h2>Ook in de bonus</h2>
  <p class="uitleg">Handig voor ontbijt, lunch en de voorraadkast. Geldig ${esc(datum(M.start))} t/m ${esc(datum(M.eind))}.</p>
  <div class="lijst">` + M.extra_bonus.map(b => `
    <div class="bonus-item"><span class="naam">${esc(b.titel)}<span class="waar">${esc(b.categorie)}</span></span><span class="sticker">${esc(b.korting)}</span></div>`).join('') + '</div>';

const knoppen = document.querySelectorAll('nav.tabs button');
function toon(tab) {
  knoppen.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  ['week', 'lijst', 'bonus'].forEach(t => document.getElementById('tab-' + t).hidden = t !== tab);
  try { localStorage.setItem('weekmenu-tab', tab); } catch (e) {}
  window.scrollTo(0, 0);
}
knoppen.forEach(b => b.addEventListener('click', () => toon(b.dataset.tab)));
try { const t = localStorage.getItem('weekmenu-tab'); if (t) toon(t); } catch (e) {}
</script>

</body>
</html>
